<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний — Аркона</title>
    <style>
:root {
    --brand: #1f4e79;
    --brand-light: #2f6aa6;
    --accent: #f0a500;
    --bg: #f4f6f9;
    --panel: #ffffff;
    --text: #1f2733;
    --muted: #6b7785;
    --border: #e2e7ee;
    --sidebar-w: 290px;
    --topbar-h: 58px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
}

/* ---------- Topbar ---------- */
#topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--brand);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    z-index: 30;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
#menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
}
.brand { display: flex; flex-direction: column; text-decoration: none; color: #fff; line-height: 1.1; }
.logo { font-weight: 800; letter-spacing: 2px; font-size: 18px; }
.brand-sub { font-size: 11px; opacity: .8; letter-spacing: 1px; }

.search-box { position: relative; margin-left: auto; width: min(420px, 50vw); }
#search {
    width: 100%;
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    outline: none;
}
#search-results {
    position: absolute;
    top: 110%; left: 0; right: 0;
    background: var(--panel);
    color: var(--text);
    list-style: none;
    margin: 0; padding: 6px;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    max-height: 60vh;
    overflow: auto;
    display: none;
}
#search-results.open { display: block; }
#search-results li { padding: 0; }
#search-results a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
}
#search-results a:hover, #search-results a.active { background: var(--bg); }
#search-results .sr-section { color: var(--muted); font-size: 12px; }
#search-results .sr-empty { padding: 10px; color: var(--muted); font-size: 13px; }

/* ---------- Layout ---------- */
#layout { display: flex; padding-top: var(--topbar-h); }

#sidebar {
    position: fixed;
    top: var(--topbar-h); bottom: 0; left: 0;
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 10px 40px;
}
.nav-block { margin-bottom: 6px; }
.nav-block > .nav-block-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    font-weight: 700;
    padding: 12px 10px 4px;
}
.nav-item {
    display: block;
    padding: 7px 10px 7px 28px;
    border-radius: 7px;
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
}
.nav-item:hover { background: var(--bg); }
.nav-item.active { background: var(--brand); color: #fff; }
.nav-item .nav-num { color: var(--muted); font-size: 12px; margin-right: 6px; }
.nav-item.active .nav-num { color: rgba(255,255,255,.75); }

#content {
    margin-left: var(--sidebar-w);
    flex: 1;
    min-width: 0;
    padding: 28px clamp(16px, 5vw, 64px) 80px;
}
#doc {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: clamp(20px, 4vw, 48px);
    max-width: 900px;
}
#doc-footer { max-width: 900px; margin-top: 18px; color: var(--muted); font-size: 13px; }

/* ---------- Markdown content ---------- */
#doc h1 { font-size: 30px; margin: 0 0 8px; color: var(--brand); }
#doc h2 { font-size: 22px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
#doc h3 { font-size: 18px; margin: 24px 0 8px; color: var(--brand-light); }
#doc h4 { font-size: 15px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
#doc p { margin: 10px 0; }
#doc ul, #doc ol { margin: 10px 0; padding-left: 24px; }
#doc li { margin: 4px 0; }
#doc a { color: var(--brand-light); }
#doc code {
    background: #eef1f5;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
}
#doc pre {
    background: #1f2733;
    color: #e6e9ef;
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
}
#doc pre code { background: transparent; padding: 0; color: inherit; }
#doc blockquote {
    margin: 14px 0;
    padding: 8px 16px;
    border-left: 4px solid var(--accent);
    background: #fff8e8;
    color: #5b4b1f;
    border-radius: 0 6px 6px 0;
}
#doc hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
#doc table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    font-size: 14px;
}
#doc th, #doc td {
    border: 1px solid var(--border);
    padding: 9px 12px;
    text-align: left;
    vertical-align: top;
}
#doc th { background: var(--bg); font-weight: 700; }
#doc tr:nth-child(even) td { background: #fafbfc; }

.tag {
    display: inline-block;
    background: var(--accent);
    color: #463500;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    vertical-align: middle;
}

/* ---------- Cards on home ---------- */
.kb-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin: 18px 0; }
.kb-card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: transform .12s, box-shadow .12s;
}
.kb-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.kb-card h3 { margin: 0 0 6px; color: var(--brand); font-size: 16px; }
.kb-card p { margin: 0; color: var(--muted); font-size: 13px; }

/* ---------- Mobile ---------- */
#backdrop {
    display: none;
    position: fixed; inset: var(--topbar-h) 0 0 0;
    background: rgba(0,0,0,.4);
    z-index: 19;
}
@media (max-width: 860px) {
    #menu-toggle { display: block; }
    #sidebar {
        transform: translateX(-100%);
        transition: transform .2s;
        z-index: 20;
        width: 280px;
        box-shadow: 4px 0 20px rgba(0,0,0,.15);
    }
    #sidebar.open { transform: translateX(0); }
    #backdrop.open { display: block; }
    #content { margin-left: 0; }
    .brand-sub { display: none; }
}

    </style>
</head>
<body>
    <header id="topbar">
        <button id="menu-toggle" aria-label="Меню">☰</button>
        <a class="brand" href="#home">
            <span class="logo">АРКОНА</span>
            <span class="brand-sub">База знаний</span>
        </a>
        <div class="search-box">
            <input type="search" id="search" placeholder="Поиск по базе знаний…" autocomplete="off">
            <ul id="search-results"></ul>
        </div>
    </header>

    <div id="layout">
        <nav id="sidebar"></nav>
        <main id="content">
            <article id="doc">Загрузка…</article>
            <footer id="doc-footer"></footer>
        </main>
    </div>

    <script>
    // Весь контент базы знаний встроен в файл — сервер и интернет не нужны.
    window.KB_CONTENT = {"00-home": "# База знаний компании «Аркона»\n\n> **Аркона решает — 365 дней в году.** Аренда спецтехники и земляные работы «под ключ» на ключевых стройках страны. На рынке с 2012 года.\n\nЭто единая база знаний и система управления компанией. Здесь каждый сотрудник находит ответ на четыре вопроса:\n\n- **Что** он должен делать (роль, ЦКП, зоны ответственности);\n- **Как** он должен это делать (регламенты, скрипты, чек-листы);\n- **Какие показатели** отвечают за результат (KPI);\n- **Где найти** нужную информацию (карточки клиентов, техники, шаблоны).\n\n---\n\n## Как устроена база знаний\n\nБаза разбита на **4 верхних блока**, внутри которых — 12 тематических разделов. Навигация — слева, полнотекстовый поиск — сверху.\n\n### 1. Люди\nКто мы, как устроена компания, кто за что отвечает, как нанимаем, обучаем и измеряем результат.\n- [О компании](#people/01-o-kompanii) — миссия, образ будущего, ценности, оргструктура, регламенты\n- [HR и найм](#people/02-hr-i-naem) — подбор, адаптация, мотивация\n- [KPI компании](#people/03-kpi) — показатели по каждой роли\n- [База обучения](#people/04-obuchenie) — корпоративный университет\n\n### 2. Процессы\nКак работает бизнес каждый день.\n- [Продажи](#processes/01-prodazhi) — менеджер, РОП, скрипты, УТП, CRM\n- [Диспетчеризация техники](#processes/02-dispetcherizaciya) — приём и закрытие заявок, подбор техники\n- [Бухгалтерия](#processes/03-buhgalteriya) — первичка, 1С, налоги\n\n### 3. Клиенты и техника\nАктивы и контрагенты компании.\n- [Автопарк](#assets/01-avtopark) — карточки техники, обслуживание, экономика\n- [Клиенты](#assets/02-klienty) — карточки и ТОП-клиенты\n- [Поставщики техники](#assets/03-postavshchiki) — база и рейтинг подрядчиков\n\n### 4. Управление\nДеньги, отчёты, стратегия.\n- [Финансы](#management/01-finansy) — финмодель, дебиторка, бюджетирование\n- [Стандартные шаблоны](#management/02-shablony) — документы, скрипты, чек-листы\n- [Отчёты, планирование, стратегия](#management/03-otchety-strategiya) — цели 2026, дорожная карта\n\n---\n\n## Наши ценности\n\n**КОМАНДА. КАЧЕСТВО. ЧЕСТНОСТЬ.**\n\n- **Команда** — помогаем друг другу, отделы работают как единое целое, задачи решаем вместе.\n- **Качество** — берём ответственность за свою работу, доводим до результата «под ключ».\n- **Честность** — корректные данные, справедливое распределение, работа по совести.\n\n---\n\n> **Как пользоваться и дополнять базу.** Каждая страница — это файл `content/…​.md`. Текст в таком блоке-цитате со словом **«Заполнить»** — это место для ваших данных (телефоны, госномера, карточки клиентов). Раздел, готовый к работе, помечен **«Готово»**; раздел в работе — **«Черновик»**.\n>\n> Источник большей части содержания — **Отчёт после стратегической сессии «Аркона», Москва, 13–14.11.2025**.\n", "management/01-finansy": "# 7. Финансы\n\n> **Статус: Готово (v1).** *Закрывает проблемы: «нет грамотного управления финансами», «нет бюджетирования».*\n\nСтратегический ориентир — **рост собственного денежного потока без зависимости от заёмных средств**.\n\n---\n\n## 7.1. Финансовая модель компании\n\n### Источники дохода\n- Аренда спецтехники (собственный парк) — цель **292 млн ₽/год**.\n- Аренда наёмной техники (маржа подрядчика).\n- Комплексные услуги «под ключ» (земляные работы, вывоз грунта/снега, демонтаж, логистика).\n- Филиал СПб — цель чистая прибыль **2 млн ₽/мес**.\n\n### Основные расходы\n- ФОТ и мотивация.\n- Топливо, ТО, ремонт, страховки техники.\n- Оплата подрядчиков (наёмная техника).\n- Маркетинг (Авито, SEO, Директ).\n- Аренда офиса, ПО (1С, CRM), накладные.\n\n### Целевые показатели 2026\n| Показатель | Цель |\n|-----------|------|\n| Выручка | 476 млн ₽/год |\n| Валовая маржа | 184 млн ₽/год |\n| Дебиторка | ≤ 200 млн ₽ |\n| Резервный фонд | 5% от чистой прибыли |\n\n---\n\n## 7.2. Дебиторская задолженность\n> *Цель — удерживать ≤ 200 млн ₽.*\n\n### Регламент контроля\n- **Матрица ответственности по дебиторке:** кто ведёт, кто напоминает, кто закрывает.\n- Авто-напоминания клиентам по оплатам.\n- **Еженедельный разбор просрочек** + персональная ответственность менеджера.\n- Жёсткая политика по новым клиентам: **лимиты** и проверка (СБ).\n\n### Алгоритм взыскания\n1. Авто-напоминание за N дней до срока.\n2. Звонок менеджера в день просрочки.\n3. Официальное письмо/претензия.\n4. Эскалация руководителю / СБ / юристу.\n\n> **Заполнить.** Точные лимиты по сегментам, сроки эскалации, шаблоны писем (см. [Шаблоны](#management/02-shablony)).\n\n---\n\n## 7.3. Бюджетирование и планирование\n- **Cash-flow на 3 месяца вперёд** + финансовый календарь.\n- Помесячное планирование выручки по продуктам: техника, спецкар, краны, СПб.\n- Анализ отклонений план/факт — еженедельно (выручка, маржа), ежеквартально (стратегия).\n- **Резервный фонд:** фиксировать 5% от чистой прибыли, расходование — только с согласования.\n- Отдельный **P&L по собственной технике**.\n\n> **Заполнить.** Бюджет на год по статьям, шаблон план/факт, регламент использования резервного фонда.\n", "management/02-shablony": "# 12. Стандартные шаблоны\n\n> **Статус: Каркас.** Единое место для документов, скриптов и чек-листов. Ссылки на файлы добавляются по мере готовности.\n\n---\n\n## Документы\n| Шаблон | Назначение | Файл |\n|--------|-----------|------|\n| Коммерческое предложение (КП) | 2 версии: для тендеров и для коммерческих клиентов | `__` |\n| Договор аренды техники | Стандартный договор | `__` |\n| Акт выполненных работ | Закрывающий документ | `__` |\n| УПД | Универсальный передаточный | `__` |\n| Претензия по дебиторке | Взыскание задолженности | `__` |\n\n> **Заполнить.** Приложить актуальные шаблоны и брендбук для оформления КП/презентаций.\n\n## Скрипты\n| Скрипт | Назначение | Статус |\n|--------|-----------|--------|\n| Холодный звонок | Первый контакт, выход на ЛПР | `__` |\n| Продажа по сегменту | Под девелопера / генподряд / муниципалитет / дороги / промышленность | см. УТП в [Продажах](#processes/01-prodazhi) |\n| Работа с возражениями | Дорого / есть подрядчик / подумаю | `__` |\n| Возврат «спящего» клиента | Реанимация старой базы | `__` |\n| Работа с дебиторкой | Напоминание об оплате | `__` |\n\n## Чек-листы\n| Чек-лист | Когда применяется |\n|----------|-------------------|\n| Выход нового сотрудника | Онбординг (см. [HR](#people/02-hr-i-naem)) |\n| Передача клиента | От коммерческого директора менеджеру |\n| Закрытие заказа | Заявка → подача → акт → оплата |\n| Качество заявки | Звонок → подача → работа → закрытие |\n| Закрытие месяца | Финансы/документы/отчётность |\n\n> **Заполнить.** Развернуть каждый чек-лист в пошаговый список с ответственными и сроками.\n", "management/03-otchety-strategiya": "# Отчёты, планирование, стратегия\n\n> **Статус: Готово (v1).** Дорожная карта развития компании по итогам стратегической сессии 13–14.11.2025.\n\n---\n\n## Ритм управления (планёрки и отчёты)\n| Периодичность | Встреча | Кто ведёт |\n|---------------|---------|-----------|\n| Ежедневно (15 мин) | Планёрка по продажам | РОП / Коммерческий директор |\n| Еженедельно | Маркетинг и финансы (план/факт) | Операционный директор |\n| Ежеквартально | Стратегическая сессия | Собственники + консультанты |\n\n---\n\n## 10 первых шагов (приоритеты внедрения)\n1. **Утвердить оргструктуру и зоны ответственности** — один руководитель на сотрудника, убрать параллельные поручения.\n2. **Разделить функции менеджеров и ассистентов** — менеджер продаёт, ассистент ведёт документы.\n3. **Ввести ежедневные KPI для менеджеров** — 30–50 звонков, 5–10 контактов, 1 встреча, фиксация в CRM.\n4. **Запустить активную лидогенерацию** — сайт + SEO (спецтехника/краны/земляные работы), Авито, Директ.\n5. **Регламент закрытия заявок и документооборота** — единый процесс, 24 ч на закрывающие, авто-напоминания.\n6. **Запустить NPS и контроль качества** — авто-опросы после заявки, еженедельный разбор проблем.\n7. **Оптимизировать 1С и автоматизировать рутину** — связка с CRM, авто-заполнение, аналитика в 1 клик.\n8. **Нанять ключевые позиции** — операционный директор, +2 ассистента, бухгалтер, маркетолог.\n9. **Старт корпоративного университета** — скрипты, возражения, 1С, Excel, видео-инструкции.\n10. **Еженедельные планёрки и единый календарь задач** — ритм, дисциплина, прозрачность.\n\n---\n\n## Стратегические цели на 2026 год\n\n### Финансы\n- Выручка **476 млн ₽/год** (+45%).\n- Валовая маржа **184 млн ₽/год**.\n- Собственная техника — **292 млн ₽/год** выручки.\n- Дебиторка **≤ 200 млн ₽**.\n- Филиал СПб — чистая прибыль **2 млн ₽/мес**.\n\n### Продажи и маркетинг\n- 200 целевых объектов; договоры с ОЭК, МВК, ТМГ, ДиМ, А-101.\n- +15 новых клиентов (оборот 2–3 млн ₽).\n- Сайт + SEO, лидогенерация (Авито/Директ), брендирование техники, презентации под сегменты.\n\n### Бизнес-процессы и люди\n- Оргструктура, регламенты, должностные инструкции и ЦКП.\n- Система мотивации/демотивации, корпоративный университет, матрица взаимодействия.\n- Парк собственной техники **26 → 38 единиц**.\n\n---\n\n## Проблемы и зоны роста (база для контроля прогресса)\nЗафиксировано на стратсессии — отслеживаем закрытие:\n\n1. Нет оргструктуры, неактуальные должностные, нет регламента работ → *раздел [О компании](#people/01-o-kompanii)*\n2. Нет своевременной оплаты подрядчикам → *[Бухгалтерия](#processes/03-buhgalteriya)*\n3. Нет взаимодействия между отделами (поток документов, алгоритмы) → *[Диспетчеризация](#processes/02-dispetcherizaciya)*\n4. Отсутствует аналитика по клиентам → *[Клиенты](#assets/02-klienty)*\n5. Нет грамотного управления финансами → *[Финансы](#management/01-finansy)*\n6. Нет системы мотивации и наказания → *[HR](#people/02-hr-i-naem)*\n7. Неравномерная нагрузка на документооборот\n8. Нет маркетинговой стратегии\n9. Нет плана продаж для МОП, нет аналитики → *[KPI](#people/03-kpi)*\n10. Нет автоматизации по незакрытым заявкам\n11. Неравномерный поток документов, несоблюдение сроков\n12. Неоптимизированная 1С → *[Бухгалтерия](#processes/03-buhgalteriya)*\n13. Несвоевременность сдачи закрывающих менеджерами\n14. Нет системы управления в компании\n15. Отсутствие иерархии, ЦКП, зоны ответственности\n16. Отсутствие стратегической цели (общей, личной, проектной)\n17. Отсутствие взаимопомощи\n18. Отсутствие чётких бизнес-процессов между отделами\n19. Отсутствие управления системой продаж → *[Продажи](#processes/01-prodazhi)*\n\n> **Заполнить.** Превратить в трекер: статус (в работе/готово), ответственный, дедлайн по каждому пункту.\n", "assets/01-avtopark": "# 4. Автопарк\n\n> **Статус: Каркас (заполняется данными).** Цель парка 2026: рост собственной техники **26 → 38 единиц**; на линии ежедневно 100+ единиц (с наёмной).\n\n---\n\n## 4.1. Карточка единицы техники\n\nДля **каждой** машины заводится карточка по шаблону:\n\n| Поле | Значение |\n|------|----------|\n| Фото | `__` |\n| Категория | Самосвал / Экскаватор / Погрузчик / Манипулятор / Кран / Коммунальная |\n| Марка и модель | `__` |\n| Госномер | `__` |\n| Год выпуска | `__` (цель парка — техника не старше 5 лет) |\n| Документы (СТС/ОСАГО/диагностика) | `__` |\n| Закреплённый водитель/оператор | `__` |\n| Стоимость часа / смены | `__` |\n| Расход топлива | `__` |\n| Себестоимость часа | `__` |\n| Минимальная цена продажи | `__` |\n\n> **Заполнить.** Завести карточку на каждую единицу парка. Ниже — пустой реестр.\n\n### Реестр техники\n| № | Категория | Марка/модель | Госномер | Водитель | Цена/час | Статус |\n|---|-----------|--------------|----------|----------|----------|--------|\n| 1 | `__` | `__` | `__` | `__` | `__` | На линии / ТО / Резерв |\n\n---\n\n## 4.2. Регламенты обслуживания\n| Тип | Периодичность | Ответственный |\n|-----|---------------|---------------|\n| ТО (плановое) | по моточасам/пробегу | `__` |\n| Ремонт | по заявке | `__` |\n| Шины (сезон) | 2×/год | `__` |\n| Страховки (ОСАГО/КАСКО) | ежегодно | `__` |\n\n> **Заполнить.** График ТО по каждой единице, журнал ремонтов, регламент простоя/замены при поломке (гарантированная замена техники — наше УТП).\n\n## 4.3. Экономика техники\n> *Закрывает задачу стратсессии: «цифровое планирование себестоимости каждой единицы техники», отдельный P&L по собственному парку.*\n\n- **Себестоимость часа** = топливо + амортизация + ФОТ водителя + ремонт/ТО + страховка + накладные.\n- **Минимальная цена продажи** = себестоимость + целевая маржа (≥ 15%).\n- **План загрузки** парка (KPI диспетчера, факт в CRM в реальном времени).\n\n> **Заполнить.** Калькулятор себестоимости по типам техники; целевой % загрузки; P&L собственного парка (цель 292 млн ₽ выручки/год).\n", "assets/02-klienty": "# 5. Клиенты\n\n> **Статус: Каркас + реальные данные.** 250+ заказчиков, 300+ объектов в год. *Закрывает проблему «отсутствует аналитика по клиентам».*\n\n---\n\n## 5.1. Карточка ключевого клиента\n\n| Поле | Значение |\n|------|----------|\n| Название / юрлицо | `__` |\n| Сегмент | Жильё / Коммерция / Промышленность / Энергетика / Дороги / Благоустройство / Муниципалитет |\n| Контакты (ЛПР) | `__` |\n| Объекты | `__` |\n| Условия оплаты | `__` (отсрочка, лимит, кредитное плечо) |\n| Ответственный менеджер | `__` |\n| Особенности работы | `__` |\n| Выручка (год) | `__` |\n\n> **Заполнить.** Завести карточку на каждого ключевого клиента.\n\n## 5.2. ТОП-клиенты и партнёры доверия\n\nКомпании, с которыми есть сотрудничество и/или благодарственные письма:\n\n| Клиент | Сегмент | Благодарственное письмо |\n|--------|---------|--------------------------|\n| ПИК | Девелопмент | да |\n| Крокус | Девелопмент/коммерция | да |\n| МСУ-1 / МСУ-18 | Строительство | да (МСУ-18) |\n| Мосводоканал | Инфраструктура | — |\n| ОЭК | Энергетика | — |\n| Брусника | Девелопмент | — |\n| Сбер | Корпоративный | — |\n| ФСК (Лидер) | Девелопмент | — |\n| КРОСТ | Девелопмент | — |\n| НПК «Химстройэнерго» | Энергетика | — |\n| ЕКС | Строительство | — |\n| Level | Девелопмент | — |\n| МосИнжПроект | Инфраструктура | — |\n| ГБУ Москвы и области | Муниципалитет | — |\n| Администрация г. Балашиха | Муниципалитет | да |\n| КСК Строй | Строительство | да |\n\n> **Заполнить.** Дополнить выручкой, историей работы и ответственным менеджером по каждому. Сформировать ТОП-50 по выручке.\n\n## 5.3. Wishlist (целевые крупные клиенты)\nПриоритет на заключение договоров — 5 крупных клиентов по ~20 млн ₽:\n- ОЭК\n- МВК (Мосводоканал)\n- ТМГ\n- ДиМ\n- А-101\n\n> **Заполнить.** Статус по каждому: контакт → встреча → КП → договор. Цель — 200 целевых объектов до конца периода.\n\n## 5.4. Сегменты (для аналитики и маркетинга)\n- Крупные (от 2 млрд) — **70%** оборота\n- Средние — **28%**\n- Физлица — **2%**\n- Приоритет по LTV: энергетика → жильё/нежильё → реновация.\n\n> Реанимация «спящих» клиентов: сегментировать старую базу по выручке и активности, запустить кампанию звонок → письмо → предложение → встреча.\n", "assets/03-postavshchiki": "# 6. Поставщики техники (подрядчики)\n\n> **Статус: Каркас.** Наёмная техника закрывает заявки, которые не покрывает собственный парк. Проверку контрагентов ведёт СБ.\n\n---\n\n## 6.1. База подрядчиков\n\n| Поле | Значение |\n|------|----------|\n| Название / юрлицо | `__` |\n| Контакты | `__` |\n| Вид техники | `__` |\n| Район работы | `__` |\n| Цены (час/смена) | `__` |\n| Условия и сроки оплаты | `__` |\n| Документы проверены (СБ) | да/нет |\n\n> **Заполнить.** Реестр подрядчиков по видам техники и районам.\n\n### Реестр\n| № | Подрядчик | Техника | Район | Цена | Рейтинг | Контакт |\n|---|-----------|---------|-------|------|---------|---------|\n| 1 | `__` | `__` | `__` | `__` | `__` | `__` |\n\n## 6.2. Рейтинг поставщиков\nОценка по критериям (1–5):\n\n| Критерий | Описание |\n|----------|----------|\n| Надёжность | Соблюдение сроков подачи, отсутствие срывов |\n| Качество техники | Состояние, возраст, оператор |\n| Долги/финансовая дисциплина | Наличие задолженностей, спорных ситуаций |\n| Документооборот | Своевременность и корректность закрывающих |\n\n> **Заполнить.** Проставить рейтинги; вести «белый» и «чёрный» списки. Проверка надёжности — обязательна перед первым заказом (СБ).\n\n## 6.3. Маржинальность наёмной техники\n- Цена клиента − цена подрядчика = маржа; цель ≥ 15%.\n- Заявки с маржой < 15% — согласование руководителя.\n- Своевременная оплата подрядчикам по единому регламенту (см. [Бухгалтерия](#processes/03-buhgalteriya)) — условие долгосрочного партнёрства.\n", "processes/01-prodazhi": "# 2. Продажи\n\n> **Статус: Готово (v1).** Содержит сегментацию клиентов, УТП по сегментам и нормы работы из стратсессии. *Закрывает проблемы: «нет плана продаж для МОП», «менеджеры не ищут клиентов активно».*\n\n---\n\n## 2.1. Работа менеджера (МОП)\n\n### ЦКП менеджера\nНовый и довольный клиент, приносящий выручку с целевой маржой, при корректно оформленных документах.\n\n### Должностная инструкция (каркас)\n- **Менеджер = продаёт** (поиск, переговоры, сделка). Документами и сопровождением занимается **ассистент**. *(Решение стратсессии — разделить функции менеджера и ассистента.)*\n- Ведёт все действия в CRM/1С (без фиксации действия «не существует»).\n- Отвечает за свою дебиторку и своих клиентов.\n\n### Ежедневные нормы (KPI)\n- **30–50 холодных звонков**\n- **5–10 новых контактов**\n- **1 встреча** (очно/онлайн)\n- Выезды на стройки с фотоотчётом в CRM\n\n### Сегментация клиентов\n**Ядро сегмента** — крупные и средние строительные компании с оборотом от 5 до 10+ млрд ₽:\n- жилищное строительство (девелоперы, генподрядчики, застройщики)\n- коммерческая и промышленная недвижимость (ТЦ, склады, заводы, логоцентры)\n- благоустройство территорий (парки, дворы, городская среда)\n- энергетическое строительство (подстанции, ЛЭП, генерация — длинные проекты, высокий LTV)\n- дорожное строительство (дороги, развязки, ремонт)\n\n**По масштабу:**\n| Категория | Доля оборота | Кто |\n|-----------|-------------|-----|\n| Крупные (оборот от 2 млрд) | **70%** | Девелоперы, застройщики, генподрядчики, госучреждения |\n| Средние | **28%** | Подрядчики, диспетчерские, благоустройство |\n| Физлица | **2%** | Разовые частные — поток/загрузка в низкий сезон |\n\n**Приоритетные стратегические клиенты:** энергетические компании (высший LTV), жилое/нежилое строительство, крупные стройкомпании (МСУ-1, ДиМ, стройтресты, компании реновации Москвы).\n\n### Ключевые клиентские ценности (почему выбирают нас)\nЦена → «всё в одном окне» → скорость 24/7 → сервис → репутация → персональный менеджер → документооборот → оперативность → гибкость → собственная техника → кэшбэк постоянным клиентам.\n\n---\n\n## 2.2. Скрипты и работа с возражениями\n\n### УТП по сегментам (для скриптов и КП)\n**Застройщики/девелоперы:** «Берём на себя весь комплекс земляных и технических работ — от подготовки площадки до вывоза грунта. Работаем 24/7, подача за 1 час, резерв техники против срыва сроков.» Короткое: *«Весь цикл работ на объекте. Техника 24/7. Подача за 1 час.»*\n\n**Генподрядчики:** «Универсальный подрядчик: 20+ видов задач, договор, персональный менеджер, объект без задержек.» Короткое: *«Один подрядчик вместо десяти — полный контроль объекта и ноль простоев.»*\n\n**Муниципальные заказчики (МБУ/ГБУ/ГКУ):** «Большой парк, опыт на муниципальных объектах, строго по срокам, 24/7, юридическая чистота и полная отчётность.» Короткое: *«Муниципальные работы без срывов. 24/7. Полная отчётность.»*\n\n**Благоустройство:** «Спецтехника + земляные/транспортные/дорожные работы в одном контракте, готовность к сезонному пику.» Короткое: *«Благоустройство без задержек. Техника всегда в наличии.»*\n\n**Промышленность/склады:** «Полный набор техники, 24/7, персональный менеджер, техника в идеальном состоянии, соблюдение требований безопасности.»\n\n**Дорожные подрядчики:** «Техника с подачей по SLA — экскаваторы, катки, самосвалы, погрузчики, грейдеры. Работаем непрерывно до завершения участка.» Короткое: *«Дороги — без остановок.»*\n\n### Универсальные УТП (сайт, КП, баннеры)\n- «Техника 24/7. Подача за 1 час.»\n- «Все работы — одним подрядчиком.»\n- «Закрываем весь объект под ключ: земля, вывоз, техника, логистика.»\n- «Надёжный партнёр крупных проектов: ПИК, Крокус, Мосводоканал, ГБУ.»\n\n### Работа с возражениями\n> **Заполнить.** Таблица «возражение → отработка» (дорого / уже есть подрядчик / нужно подумать / нет техники в наличии). Использовать речевые модули и обучать на тренингах.\n\n---\n\n## 2.3. Работа РОПа\n- **Обязанности:** распределение клиентов и заявок, контроль KPI менеджеров, разбор воронки и дебиторки, обучение и наставничество.\n- **Ежедневный контроль:** план/факт по звонкам, встречам, заявкам; «лиды день/неделя/месяц».\n- **Планёрки:** ежедневная по продажам (15 мин), еженедельный разбор просрочек дебиторки.\n\n## 2.4. Коммерческий директор\n- Поиск и заключение крупных клиентов (wishlist: ОЭК, МВК, ТМГ, ДиМ, А-101).\n- **Передача клиента** менеджеру по шаблону (см. [Шаблоны](#management/02-shablony)) с согласованными сроками обработки.\n- Контроль менеджеров, согласование сложных заявок и сделок с маржой < 15%.\n\n---\n\n## 2.5. CRM (Битрикс24 / 1С)\n> *Закрывает проблемы: «нет аналитики по клиентам», «нет оцифровки заявок».*\n\n- **Воронки:** разделить по сегментам (реновация, энергетика, промышленность, благоустройство, дороги).\n- **Статусы заявки/сделки:** `Новая` → `В работе` → `Закрыто` → `Проблема`.\n- Связка **CRM ↔ 1С**: единое окно, авто-напоминания по оплатам и документам.\n- Все выезды, звонки и договорённости фиксируются в карточке.\n\n> **Заполнить.** Пошаговая инструкция по Битрикс24: создание сделки, ведение воронки, постановка задач ассистенту, выгрузка отчётов.\n", "processes/02-dispetcherizaciya": "# 3. Диспетчеризация техники\n\n> **Статус: Готово (v1).** *Закрывает проблемы: «нет регламента работ», «отсутствие взаимодействия между отделами», «нет автоматизации по незакрытым заявкам».*\n\nЦКП диспетчера: заявка закрыта вовремя, техника подобрана с максимальной маржой, собственный парк загружен.\n\n---\n\n## 3.1. Общие правила\n\n### Алгоритм приёма заявки\n1. Заявка поступает (от менеджера/клиента) → фиксируется в CRM/1С со статусом `Новая`.\n2. Уточняются параметры: вид техники, объект, даты/смены, условия, контактное лицо.\n3. Проверка приоритета и маржинальности.\n4. Назначение техники → статус `В работе`.\n5. Контроль исполнения → закрытие → статус `Закрыто`.\n6. Проблемные заявки → статус `Проблема` + эскалация руководителю.\n\n### Алгоритм подбора техники\n1. **Сначала — собственный парк** (управляемость, маржа, контроль). Проверить загрузку и доступность.\n2. Если своей нет/занята — наёмная техника от проверенных подрядчиков.\n3. Расчёт маржи: цена клиента − себестоимость (своя) / цена подрядчика (наёмная). Заявки с маржой **< 15% — через согласование руководителя**.\n\n### Приоритеты\n1. Приоритет загрузки **собственного парка** (KPI диспетчера).\n2. Крупные/приоритетные клиенты (энергетика, девелоперы, генподряд).\n3. Закрытие **всех** потребностей клиента, включая разовые/невыгодные заявки (ценность «всё в одном окне»).\n4. Скорость подачи — цель **1 час**.\n\n---\n\n## 3.2. Собственный парк\nКатегории собственной техники (подробные карточки — в разделе [Автопарк](#assets/01-avtopark)):\n- Самосвалы\n- Манипуляторы\n- Экскаваторы\n- Погрузчики\n- Краны (новое направление)\n- Коммунальная техника (илососы, КДМ, МТЗ)\n\n> Цель загрузки фиксируется в CRM в реальном времени (план/факт %).\n\n## 3.3. Наёмная техника\n- **Поиск подрядчиков:** по базе проверенных поставщиков (см. [Поставщики](#assets/03-postavshchiki)).\n- **Проверка поставщиков:** документы, надёжность, наличие техники, история. Проверку рисков ведёт СБ.\n- **Маржинальность:** контролируется по каждой наёмной единице; цель — не работать «в ноль».\n- **Регламент оплаты подрядчикам:** единые сроки и ответственные. *(Закрывает проблему «нет своевременной оплаты подрядчикам».)*\n\n## 3.4. Работа с заказом (полный цикл)\n```\nЗаявка → Подбор/назначение техники → Подача на объект →\nВыполнение работ → Закрывающие документы (24 ч) → Оплата → Закрытие\n```\n\n### Регламент закрытия заявок и документооборота\n- Единый процесс: от заявки → подачи → акта → оплаты.\n- **Жёсткий срок: 24 часа на закрывающие документы.**\n- Авто-напоминания клиентам по оплатам и документам.\n- Контроль «висящих» заявок — еженедельный разбор, недопущение потери клиента.\n\n### NPS и контроль качества\n- Авто-опрос клиента после каждой заявки (оценка 1–10).\n- Еженедельный разбор проблемных заявок; отработка негатива менеджером.\n\n> **Заполнить.** Точные SLA по времени подачи по типам техники, шаблон чек-листа качества «звонок → подача → работа → закрытие».\n", "processes/03-buhgalteriya": "# 8. Бухгалтерия\n\n> **Статус: Черновик.** *Закрывает проблемы: «неоптимизированная 1С», «неравномерный поток документов, несоблюдение сроков», «несвоевременность сдачи закрывающих документов».*\n\nЦКП бухгалтерии: корректные данные «до копейки», вовремя сданные документы, оплаченные подрядчики, закрытые налоговые обязательства.\n\n---\n\n## 8.1. Первичная документация\nОсновные документы и регламент:\n\n| Документ | Когда оформляется | Срок | Ответственный |\n|----------|-------------------|------|---------------|\n| Счёт на оплату | При старте работ/по договору | `___` | Ассистент ОП / Бухгалтер |\n| Акт выполненных работ | По завершении работ | **24 ч** | Документооборот |\n| УПД | По отгрузке/услуге | `___` | Бухгалтер |\n| Договор | При новой сделке | `___` | Документооборот |\n\n> **Заполнить.** Регламент маршрута документа: кто создаёт → кто подписывает → кто отправляет клиенту → кто контролирует возврат подписанного экземпляра.\n\n## 8.2. Работа в 1С\n- **Корректность данных в 1С — базовая ценность компании (честность).**\n- Связка **1С ↔ CRM**, авто-заполнение, модуль оплат подрядчиков, отчётность «в 1 клик».\n- Оптимизация и доработка 1С — один из «10 первых шагов»: экономит 20–40% времени сотрудников.\n\n> **Заполнить.** Пошаговые инструкции: проведение реализации, выставление счёта/акта/УПД, сверка, типовые ошибки и как их избегать.\n\n## 8.3. НДС и налоги\n> **Заполнить.** Памятки по НДС, режимам налогообложения юрлиц компании, регламенту и срокам сдачи отчётности, взаимодействию с налоговой.\n\n---\n\n## 8.4. Оплата подрядчиков (регламент)\n- Единый регламент: **сроки, перечень документов, ответственные**.\n- Оплата — только при полном комплекте закрывающих документов от подрядчика.\n- Планирование оплат через финансовый календарь (см. [Финансы](#management/01-finansy)).\n\n> **Заполнить.** Точные сроки оплаты (например, в течение N дней после акта), лимиты, порядок согласования.\n", "people/01-o-kompanii": "# 1. О компании\n\n> **Статус: Готово (v1).** Источник — Отчёт после стратегической сессии «Аркона», 13–14.11.2025.\n\n«Аркона» — федеральная компания по аренде спецтехники и выполнению земляных и строительных работ «под ключ». На рынке **с 2012 года** (юридическому лицу 13+ лет). База — Москва, развитие — Санкт-Петербург, перспектива — Крым.\n\n---\n\n## 1.1. Миссия, образ будущего и цели\n\n### Миссия\n**Мы помогаем реализовывать самые амбициозные проекты в строительной отрасли ради всей страны и каждого человека. Мы — лучший сервис по аренде спецтехники. Аркона решает — 365 дней в году.**\n\n### Суперцель\nСтать ведущей инфраструктурной компанией страны, участвующей в ключевых стройках России, имеющей филиалы **Москва — Питер — Крым**, экосистему новых направлений и устойчивую собственную финансовую модель, где развитие команды и рост IQ каждого сотрудника обеспечивают бесконечный рост бизнеса.\n\n### Образ будущего «Аркона 2028»\n- Масштабная **федеральная структура** с тремя ключевыми филиалами: Москва, Санкт-Петербург, Крым (штаб-квартира и точка развития на новые территории).\n- Запущено новое стратегическое направление — **крановая техника**; общий парк **70+ единиц**.\n- Устойчивый рост **собственного** денежного потока без зависимости от заёмных средств.\n- Ориентир «**20/20**» — 20 крупных заказчиков по 20 млрд — как долгосрочный горизонт.\n- Метафора — **колесо бесконечного развития**: в центре команда («Основа»), вокруг — направления (Москва, СПб, Крым, краны, спецкар, логистика, грузоперевозки), в фундаменте — рост IQ и обучение каждого.\n\n### Чем отличаемся от конкурентов (ключевые клиентские ценности)\n1. **«Всё в одном окне»** — все виды техники и работ у одного подрядчика.\n2. **Скорость** — подача техники за 1 час, работа 24/7.\n3. **Собственный парк** — управляемость сроками и контроль исполнения.\n4. **Качественный сервис и документооборот** — соблюдение сроков, минимум ошибок.\n5. **Репутация и доверие** — 12+ лет на рынке, проекты федерального уровня.\n6. **Персональный менеджер** на каждом объекте, на связи 24/7.\n7. **Гибкость** — кастомные решения под задачи объекта.\n\n---\n\n## 1.2. Организационная структура\n\n> **Заполнить.** Вставьте утверждённую схему оргструктуры (диаграмму) и ФИО сотрудников. Ниже — целевая структура ролей по итогам стратсессии. *Проблема №1 из стратсессии: «Нет оргструктуры, неактуальные должностные инструкции» — этот раздел закрывает её.*\n\n### Целевая иерархия\n```\nСобственники\n   └─ Операционный директор (+ бизнес-консультанты)\n        ├─ Коммерческий директор\n        │     └─ РОП → Менеджеры (МОП) → Ассистенты ОП\n        ├─ Руководитель диспетчеризации/транспорта → Диспетчеры → Водители/Операторы\n        ├─ Руководитель документооборота → Ассистенты ДО\n        ├─ Главный бухгалтер → Бухгалтер на первичку\n        ├─ HR\n        ├─ Маркетолог (+ ассистент маркетинга)\n        └─ Служба безопасности\n```\n\n### Отделы (категории базы знаний)\nПо образцу отраслевых LMS каждый раздел дополнительно размечен по отделу:\n\n| Код | Отдел | Зона ответственности |\n|-----|-------|----------------------|\n| ОП | Отдел продаж | Поиск и ведение клиентов, выручка, маржа |\n| ТО/ОЛ | Транспорт / Логистика / Диспетчеризация | Приём заявок, подбор и назначение техники, загрузка парка |\n| ДО | Отдел документооборота | Закрывающие документы, договоры, сроки |\n| ОБ | Отдел бухгалтерии | Первичка, 1С, налоги, оплата подрядчиков |\n| HR | HR-отдел | Найм, адаптация, мотивация, обучение |\n| СБ | Служба безопасности | Проверка контрагентов, дебиторка, риски |\n| ТОР | Для руководителей | Управление, планёрки, стратегия |\n\n### Принципы управления (из стратсессии)\n- **Один руководитель на одного сотрудника** — никаких параллельных поручений от разных начальников.\n- У каждой роли есть **ЦКП** (ценный конечный продукт), зоны ответственности и приоритеты.\n- Сложные/нестандартные заявки и сделки с маржой < 15% — **через согласование руководителя**.\n\n---\n\n## 1.3. Регламенты компании\n\n> **Заполнить.** Ниже — каркас регламентов. Внесите фактические значения (часы, лимиты дней, контакты).\n\n### Рабочее время\n- График работы офиса: `_____` (например, Пн–Пт 9:00–18:00).\n- Диспетчеризация и подача техники — **24/7**.\n- Персональный менеджер на объекте — на связи **24/7**.\n\n### Отпуска и подмены\n- Заявление на отпуск подаётся за `___` дней.\n- **Регламент подмены:** на время отпуска/болезни сотрудника назначается замещающий, ответственность за задачи передаётся по матрице взаимодействия. *(Закрывает проблему «нет регламента на время отпуска».)*\n\n### Больничные\n- Уведомление руководителя в день открытия больничного.\n- Передача активных задач замещающему по чек-листу.\n\n### Правила коммуникации\n- Основной канал оперативной связи: `_____` (например, корпоративный Битрикс24 / Telegram).\n- **Планёрки:** ежедневные по продажам (15 мин), еженедельные по маркетингу и финансам, ежеквартальные — стратегические сессии.\n- Все договорённости по заявкам и клиентам фиксируются в **CRM/1С** (устные договорённости «не существуют»).\n- Тон общения: уважение, честность, командность — согласно ценностям компании.\n\n---\n\n## Ценности компании: КОМАНДА. КАЧЕСТВО. ЧЕСТНОСТЬ\n\n**1. Команда** — каждый помогает друг другу, отделы работают как единая команда, задачи решаются вместе; взаимовыручка, уважение и командный дух — и в работе, и в человеческом отношении.\n\n**2. Качество** — каждый берёт ответственность за свою работу, делает её максимально хорошо, доводит до результата «под ключ» независимо от сложности или выгоды, своевременно даёт обратную связь клиентам и работает так, чтобы можно было гордиться итогом.\n\n**3. Честность** — корректные данные (особенно в 1С), честное и равное распределение обязанностей и заявок, признание ошибок, открытость, работа по совести и поддержка коллег в каждой ситуации.\n", "people/02-hr-i-naem": "# 9. HR и найм\n\n> **Статус: Готово (v1).** Включает позиционирование работодателя из стратсессии и онбординг-трек по образцу отраслевой LMS.\n\n---\n\n## 9.1. Подбор сотрудников\n\n### Приоритет найма (из стратсессии)\n1. **Операционный директор** (совместно с бизнес-консультантами) — срочно, чтобы разгрузить собственников.\n2. **+2 ассистента** — снимают операционный хаос (ASAP).\n3. **Бухгалтер на первичку**.\n4. **Маркетолог / проджект** — проектная ставка + KPI на лиды.\n\n### Портрет кандидата\n> **Заполнить** по каждой роли. Базовый шаблон:\n\n| Параметр | Описание |\n|----------|----------|\n| Роль | Менеджер ОП / Диспетчер / Ассистент / … |\n| Ключевой результат (ЦКП) | Что должно появиться на выходе |\n| Опыт | Отрасль, годы, инструменты (1С, CRM, Excel) |\n| Hard skills | Конкретные навыки |\n| Soft skills | Командность, ответственность, честность (наши ценности) |\n| Стоп-факторы | Что недопустимо |\n\n### Продающее позиционирование работодателя (для HH / SuperJob / Работа.ру)\n**Аркона — компания, в которой приятно работать, интересно расти и хочется оставаться надолго.**\n\nПочему хочется стать частью «Арконы»:\n1. **Люди и культура** — лояльное и открытое руководство, дружный молодой коллектив, атмосфера поддержки, корпоративы, уважение и справедливость.\n2. **Реальный рост** — развитие вместе с компанией и рост IQ, возможность влиять на доход (МОП), понятная карьерная траектория, шанс стать бизнес-партнёром.\n3. **Условия** — современный офис в 0 минутах от метро, льготное кредитование для сотрудников.\n4. **Уверенность в завтрашнем дне** — сильная компания, стабильная база крупных клиентов, проекты федерального уровня.\n\n**Короткий вариант для шапки вакансии:**\n> Аркона — лучший сервис спецтехники. Сильная команда. Честное руководство. Рост, стабильность и драйв. Присоединяйся!\n\n### Вопросы на собеседовании\n> **Заполнить.** Рекомендуемые блоки: мотивация, опыт в отрасли, работа с конфликтом/возражениями (для ОП), отношение к ответственности за дебиторку и документы, соответствие ценностям (команда/качество/честность).\n\n---\n\n## 9.2. Адаптация (онбординг-трек)\n\nСтруктура по образцу отраслевой LMS — единый трек для нового сотрудника. **Каждый модуль завершается тестированием.**\n\n| № | Модуль | Формат | Срок |\n|---|--------|--------|------|\n| 1.1 | Кодекс и ценности «Арконы» | Документ + видео | День 1 |\n| 1.2 | Презентация для новых сотрудников | Презентация | День 1 |\n| 1.3 | План стажировки по отделу | Чек-лист | Дни 1–30 |\n| 1.4 | Карьерный рост в отделе | Документ | Неделя 1 |\n| 1.5 | Должностная инструкция роли | Документ | День 2 |\n| 1.6 | Тестирование №1 | Тест | Неделя 1 |\n\n### План адаптации на 30 дней\n- **Дни 1–3:** ценности, оргструктура, знакомство с командой, доступы (CRM/1С), рабочее место.\n- **Неделя 1:** должностная инструкция, ЦКП, KPI, наставник, теневая работа.\n- **Недели 2–3:** самостоятельные задачи под контролем, обучение инструментам (1С, CRM, Excel), скрипты.\n- **Неделя 4:** аттестация (тестирование), обратная связь, план развития, выход на план.\n\n> **Чек-лист «Выход нового сотрудника»** — см. раздел [Стандартные шаблоны](#management/02-shablony).\n\n---\n\n## 9.3. Мотивация\n\n> *Закрывает проблему стратсессии: «Нет системы мотивации и наказания».*\n\n### Принципы\n- Оплата = оклад + переменная часть за выполнение **KPI** (см. [KPI компании](#people/03-kpi)).\n- **Менеджер может влиять на свой доход** через результат (МОП).\n\n### Мотивация (премии)\n- За выполнение/перевыполнение плана продаж и маржи.\n- За возврат «спящих» клиентов.\n- За 100% закрытие заявок (включая невыгодные/разовые).\n\n### Демотивация (штрафы)\n- За просрочку закрывающих документов (норма — 24 часа).\n- За нарушение регламентов и сроков.\n- За некорректные данные в 1С и плохой документооборот.\n\n> **Заполнить.** Конкретные суммы/проценты премий и штрафов утверждаются собственниками и фиксируются в Положении о мотивации.\n", "people/03-kpi": "# 10. KPI компании\n\n> **Статус: Готово (v1).** Целевые значения — из стратегических целей на 2026 г. Персональные нормы менеджеров — из блока «10 первых шагов».\n\nKPI отвечают на вопрос «какие показатели определяют результат» для каждой роли. Один сотрудник — понятный набор измеримых показателей.\n\n---\n\n## Стратегические цели компании на 2026 год\n\n| Показатель | Цель 2026 | Комментарий |\n|-----------|-----------|-------------|\n| Выручка | **476 млн ₽/год** (36,34 млн/мес) | +45% к 2025 г. |\n| Валовая маржа | **184 млн ₽/год** (15,34 млн/мес) | — |\n| Выручка по собственной технике | **292 млн ₽/год** (21 млн/мес) | Отдельный P&L |\n| Дебиторская задолженность | **≤ 200 млн ₽** | Удерживать на уровне |\n| Филиал СПб | **чистая прибыль 2 млн ₽/мес** | Локальное управление + маркетплан |\n| Парк собственной техники | **рост 26 → 38 единиц** | К концу 2026 |\n| Новые клиенты | **+15** (оборот 2–3 млн ₽ каждый) | Через активные продажи |\n\n---\n\n## 10.1. Собственник\n- Выручка\n- Валовая прибыль / маржа\n- EBITDA\n- Чистый денежный поток (рост собственного, снижение заёмного)\n\n## 10.2. Коммерческий директор\n- Новые крупные клиенты (wishlist: ОЭК, МВК, ТМГ, ДиМ, А-101 — 5 шт. по ~20 млн)\n- Объём продаж / выполнение плана выручки\n- Маржинальность по сегментам\n\n## 10.3. РОП\n- Выполнение плана продаж отделом\n- Дебиторская задолженность отдела (≤ целевого уровня)\n- Конверсия воронки: контакты → встречи → заявки → деньги\n- Дисциплина KPI менеджеров (контроль ежедневный)\n\n## 10.4. Менеджер (МОП)\n| KPI | Норма |\n|-----|-------|\n| Холодные звонки | **30–50 в день** |\n| Новые контакты | **5–10 в день** |\n| Встречи (вкл. онлайн) | **1 в день** |\n| Новые клиенты | по личному плану (вклад в +15) |\n| Маржа по своим сделкам | ≥ целевой |\n| Фиксация действий в CRM/1С | 100% |\n| Сдача закрывающих документов | в срок (24 ч) |\n\n## 10.5. Диспетчер\n- Маржинальность заявок\n- Скорость закрытия заявок (время приём → подача)\n- **Загрузка собственного парка** (план/факт, % в реальном времени)\n- Доля закрытых «висящих» заявок\n\n## 10.6. Маркетолог\n- Количество лидов по каналам (Авито, SEO, Директ)\n- Стоимость лида (CPL)\n- Конверсия лид → заявка\n\n## 10.7. Документооборот / Бухгалтерия\n- Доля документов, сданных в срок\n- Отсутствие ошибок в первичке и 1С\n- Своевременность оплаты подрядчикам\n\n> **Заполнить.** Проставьте плановые числовые значения и веса KPI для расчёта премий в Положении о мотивации.\n", "people/04-obuchenie": "# 11. База обучения (Корпоративный университет)\n\n> **Статус: Готово (v1).** Структура курсов — по образцу отраслевой LMS (категории = отделы, внутри — нумерованные модули с тестированием). *Закрывает задачу стратсессии: «Создать корпоративный университет — База знаний».*\n\nПринцип: **«Мы растём не только деньгами, но и мозгами»** — рост IQ каждого сотрудника как топливо компании.\n\n---\n\n## Как устроено обучение\n\n- Обучение разбито на **курсы по отделам**; внутри курса — нумерованные модули.\n- Каждый модуль завершается **тестированием**.\n- Прогресс фиксируется; по итогам — аттестация и план развития.\n\n### Карта курсов по отделам\n\n| Отдел | Курс (онбординг + развитие) |\n|-------|------------------------------|\n| Общий (до начала) | Кодекс и ценности, презентация для новых, охрана труда |\n| Отдел продаж (ОП) | Знакомство с ОП, продукт и УТП, скрипты, работа с возражениями, CRM |\n| Диспетчеризация/Транспорт (ТО) | Виды техники, алгоритм заявки, подбор техники, 1С |\n| Документооборот (ДО) | Закрывающие документы, сроки, 1С |\n| Бухгалтерия (ОБ) | Первичка, 1С, НДС/налоги |\n| Руководители (ТОР) | Управление, планёрки, KPI, дашборды |\n\n### Пример онбординг-курса «Знакомство с Отделом продаж»\n1. 1.1 — Кодекс и ценности «Арконы»\n2. 1.2 — Презентация для новых сотрудников\n3. 1.3 — План стажировки\n4. 1.4 — Карьерный рост в отделе продаж\n5. 1.5 — Должностная инструкция менеджера\n6. 1.6 — Тестирование №1\n7. 2.1 — Обучающий курс по CRM (Битрикс24)\n8. 2.2 — Интерфейс и воронки в CRM\n\n---\n\n## 11.1. Спецтехника (база знаний по технике)\nВиды техники и для чего используется:\n\n| Категория | Техника | Назначение |\n|-----------|---------|-----------|\n| Землеройная | Экскаваторы, погрузчики | Котлованы, траншеи, погрузка |\n| Грузоподъёмная | Краны, манипуляторы | Подъём и перемещение грузов |\n| Дорожная | Катки, асфальтоукладчики, грейдеры | Дорожное строительство |\n| Логистика | Самосвалы, длинномеры, тралы | Перевозка грунта, материалов, негабарита |\n| Коммунальная | Илососы, каналопромывочные, КДМ, МТЗ | Городские/коммунальные задачи, уборка снега |\n\n> **Заполнить.** Добавьте по каждому типу: фото, технические характеристики, типовые задачи, требования к оператору, частые ошибки эксплуатации.\n\n## 11.2. Строительство (отраслевая грамотность)\n> **Заполнить.** Основные процессы стройки (котлован → благоустройство → дорожки → инженерка), термины, этапы объекта, кто такие девелопер / генподрядчик / застройщик / субподрядчик — чтобы менеджер говорил с клиентом на одном языке.\n\n## 11.3. Продажи (развитие навыков)\n- Скрипты продаж и работа с возражениями (см. [Продажи](#processes/01-prodazhi)).\n- Обучение 1С и Excel для отчётности.\n- Видео-инструкции по процессам.\n> **Заполнить.** Список книг, видеоуроков и разбор реальных кейсов компании (выигранные крупные сделки, сложные объекты).\n"};

    <script>
/* ============================================================
   База знаний «Аркона» — навигация, роутинг, рендер Markdown, поиск.
   Чистый ванильный JS, без зависимостей. Контент живёт в /content/*.md
   ============================================================ */

// ---- Структура: 4 верхних блока → разделы (12 тем) ----
const NAV = [
    {
        title: "Люди",
        items: [
            { id: "people/01-o-kompanii",   num: "1",  title: "О компании" },
            { id: "people/02-hr-i-naem",    num: "9",  title: "HR и найм" },
            { id: "people/03-kpi",          num: "10", title: "KPI компании" },
            { id: "people/04-obuchenie",    num: "11", title: "База обучения" },
        ]
    },
    {
        title: "Процессы",
        items: [
            { id: "processes/01-prodazhi",          num: "2", title: "Продажи" },
            { id: "processes/02-dispetcherizaciya",  num: "3", title: "Диспетчеризация техники" },
            { id: "processes/03-buhgalteriya",       num: "8", title: "Бухгалтерия" },
        ]
    },
    {

        items: [
            { id: "assets/01-avtopark",      num: "4", title: "Автопарк" },
            { id: "assets/02-klienty",       num: "5", title: "Клиенты" },
            { id: "assets/03-postavshchiki", num: "6", title: "Поставщики техники" },
        ]
    },
    {
        title: "Управление",
        items: [
            { id: "management/01-finansy",            num: "7",  title: "Финансы" },
            { id: "management/02-shablony",           num: "12", title: "Стандартные шаблоны" },
            { id: "management/03-otchety-strategiya", num: "—",  title: "Отчёты, планирование, стратегия" },
        ]
    },
];

const HOME = { id: "00-home", title: "Главная" };

// Плоский индекс id → {title, block}
const PAGE_INDEX = {};
PAGE_INDEX[HOME.id] = { title: HOME.title, block: "" };
NAV.forEach(b => b.items.forEach(it => PAGE_INDEX[it.id] = { title: it.title, block: b.title }));

// ---------------------------------------------------------------
// Минималистичный Markdown → HTML рендер (заголовки, списки,
// таблицы, цитаты, код, жирный/курсив, ссылки, hr).
// ---------------------------------------------------------------
function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(text) {
    // экранируем, затем восстанавливаем разметку
    let t = escapeHtml(text);
    t = t.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, href) => `<a href="${href}">${txt}</a>`);
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    return t;
}

function renderMarkdown(md) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    let html = "";
    let i = 0;

    const flushList = (buf, ordered) => {
        if (!buf.length) return "";
        const tag = ordered ? "ol" : "ul";
        return `<${tag}>` + buf.map(li => `<li>${inline(li)}</li>`).join("") + `</${tag}>`;
    };

    while (i < lines.length) {
        let line = lines[i];

        // Пустая строка
        if (/^\s*$/.test(line)) { i++; continue; }

        // Кодовый блок ```
        if (/^```/.test(line)) {
            let code = [];
            i++;
            while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
            i++; // закрывающие ```
            html += `<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`;
            continue;
        }

        // Горизонтальная линия
        if (/^---+\s*$/.test(line)) { html += "<hr>"; i++; continue; }

        // Заголовки
        const h = line.match(/^(#{1,4})\s+(.*)$/);
        if (h) { const lvl = h[1].length; html += `<h${lvl}>${inline(h[2])}</h${lvl}>`; i++; continue; }

        // Цитата
        if (/^>\s?/.test(line)) {
            let quote = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, "")); i++; }
            html += `<blockquote>${inline(quote.join(" "))}</blockquote>`;
            continue;
        }

        // Таблица (| ... | ... |)
        if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
            const parseRow = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
            const headers = parseRow(line);
            i += 2; // пропускаем строку-разделитель
            let body = "";
            while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
                const cells = parseRow(lines[i]);
                body += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
                i++;
            }
            html += "<table><thead><tr>" + headers.map(c => `<th>${inline(c)}</th>`).join("") +
                    "</tr></thead><tbody>" + body + "</tbody></table>";
            continue;
        }

        // Маркированный список
        if (/^\s*[-*]\s+/.test(line)) {
            let buf = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
            html += flushList(buf, false);
            continue;
        }

        // Нумерованный список
        if (/^\s*\d+\.\s+/.test(line)) {
            let buf = [];
            while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
            html += flushList(buf, true);
            continue;
        }

        // Параграф (склеиваем подряд идущие строки)
        let para = [line];
        i++;
        while (i < lines.length && !/^\s*$/.test(lines[i]) &&
               !/^(#{1,4}\s|>|\s*[-*]\s|\s*\d+\.\s|```|---+\s*$|\s*\|)/.test(lines[i])) {
            para.push(lines[i]); i++;
        }
        html += `<p>${inline(para.join(" "))}</p>`;
    }
    return html;
}

// ---------------------------------------------------------------
// Навигация
// ---------------------------------------------------------------
function buildSidebar() {
    const nav = document.getElementById("sidebar");
    let html = `<a class="nav-item" href="#${HOME.id}" data-id="${HOME.id}">🏠 Главная</a>`;
    NAV.forEach(block => {
        html += `<div class="nav-block"><div class="nav-block-title">${block.title}</div>`;
        block.items.forEach(it => {
            html += `<a class="nav-item" href="#${it.id}" data-id="${it.id}">` +
                    `<span class="nav-num">${it.num}.</span>${it.title}</a>`;
        });
        html += `</div>`;
    });
    nav.innerHTML = html;
}

function setActiveNav(id) {
    document.querySelectorAll(".nav-item").forEach(a => {
        a.classList.toggle("active", a.dataset.id === id);
    });
}

// ---------------------------------------------------------------
// Роутинг + загрузка контента
// ---------------------------------------------------------------
const docCache = {};

async function loadPage(id) {
    if (!PAGE_INDEX[id]) id = HOME.id;
    const doc = document.getElementById("doc");
    const footer = document.getElementById("doc-footer");
    setActiveNav(id);

    try {
        let md = docCache[id];
        if (md === undefined) {
            // Автономный режим: контент встроен в страницу (один HTML-файл).
            if (window.KB_CONTENT && window.KB_CONTENT[id] != null) {
                md = window.KB_CONTENT[id];
            } else {
                const res = await fetch(`content/${id}.md`);
                if (!res.ok) throw new Error(res.status);
                md = await res.text();
            }
            docCache[id] = md;
        }
        doc.innerHTML = renderMarkdown(md);
        const meta = PAGE_INDEX[id];
        footer.innerHTML = meta.block
            ? `Раздел: <strong>${meta.block}</strong> · Файл: <code>content/${id}.md</code>`
            : `Файл: <code>content/${id}.md</code>`;
        document.getElementById("content").scrollTop = 0;
        window.scrollTo(0, 0);
    } catch (e) {
        doc.innerHTML = `<h1>Не удалось загрузить страницу</h1>
            <p>Файл <code>content/${id}.md</code> не найден или сайт открыт без локального сервера.</p>
            <blockquote>Для просмотра запустите простой сервер в папке <code>knowledge-base/</code>:<br>
            <code>python3 -m http.server 8000</code> и откройте <code>http://localhost:8000</code>.</blockquote>`;
        footer.innerHTML = "";
    }
    closeSidebar();
}

function router() {
    const id = location.hash.replace(/^#/, "") || HOME.id;
    loadPage(id);
}

// ---------------------------------------------------------------
// Поиск (полнотекстовый по загруженным .md, ленивая индексация)
// ---------------------------------------------------------------
let searchIndex = null;

async function buildSearchIndex() {
    if (searchIndex) return searchIndex;
    searchIndex = [];
    const ids = Object.keys(PAGE_INDEX);
    await Promise.all(ids.map(async id => {
        try {
            let md = docCache[id];
            if (md === undefined) {
                if (window.KB_CONTENT && window.KB_CONTENT[id] != null) {
                    md = window.KB_CONTENT[id]; docCache[id] = md;
                } else {
                    const res = await fetch(`content/${id}.md`);
                    if (res.ok) { md = await res.text(); docCache[id] = md; }
                }
            }
            if (md) searchIndex.push({ id, title: PAGE_INDEX[id].title, block: PAGE_INDEX[id].block, text: md.toLowerCase() });
        } catch (e) { /* пропускаем */ }
    }));
    return searchIndex;
}

async function runSearch(q) {
    const box = document.getElementById("search-results");
    q = q.trim().toLowerCase();
    if (q.length < 2) { box.classList.remove("open"); box.innerHTML = ""; return; }
    const idx = await buildSearchIndex();
    const hits = [];
    idx.forEach(p => {
        const inTitle = p.title.toLowerCase().includes(q);
        const pos = p.text.indexOf(q);
        if (inTitle || pos >= 0) {
            let snippet = "";
            if (pos >= 0) {
                const start = Math.max(0, pos - 35);
                snippet = (start > 0 ? "…" : "") +
                    p.text.slice(start, pos + q.length + 45).replace(/\n/g, " ").replace(/[#*>|`-]/g, "") + "…";
            }
            hits.push({ ...p, snippet, score: (inTitle ? 100 : 0) + (pos >= 0 ? 10 : 0) });
        }
    });
    hits.sort((a, b) => b.score - a.score);
    if (!hits.length) {
        box.innerHTML = `<li class="sr-empty">Ничего не найдено по запросу «${q}»</li>`;
    } else {
        box.innerHTML = hits.slice(0, 12).map(h =>
            `<li><a href="#${h.id}"><strong>${h.title}</strong>` +
            `<span class="sr-section"> · ${h.block || "Главная"}</span>` +
            (h.snippet ? `<br><span class="sr-section">${h.snippet}</span>` : "") + `</a></li>`
        ).join("");
    }
    box.classList.add("open");
}

// ---------------------------------------------------------------
// Мобильное меню
// ---------------------------------------------------------------
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("backdrop")?.classList.add("open");
}
function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("backdrop")?.classList.remove("open");
}

// ---------------------------------------------------------------
// Инициализация
// ---------------------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
    buildSidebar();

    // backdrop для мобильного меню
    const backdrop = document.createElement("div");
    backdrop.id = "backdrop";
    document.body.appendChild(backdrop);
    backdrop.addEventListener("click", closeSidebar);
    document.getElementById("menu-toggle").addEventListener("click", openSidebar);

    // поиск
    const search = document.getElementById("search");
    let t;
    search.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => runSearch(search.value), 180); });
    document.addEventListener("click", e => {
        if (!e.target.closest(".search-box")) document.getElementById("search-results").classList.remove("open");
    });
    document.getElementById("search-results").addEventListener("click", () => {
        document.getElementById("search-results").classList.remove("open");
        search.value = "";
    });

    window.addEventListener("hashchange", router);
    router();
});

    </script>
</body>
</html>
